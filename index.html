<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda Cultural Venezolana en UK</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8667684098323123" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased font-sans">

  <div id="root"></div>

  <script type="text/babel">
    const Calendar = (p) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>);
    const MapPin = (p) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>);
    const Search = (p) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>);
    const RefreshCw = (p) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>);
    const ExternalLink = (p) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>);
    const Compass = (p) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>);
    const Mail = (p) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>);
    const Filter = (p) => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>);

    const categories = ['Todos', 'Artes Plásticas', 'Cine', 'Música', 'Teatro', 'Deportes', 'Comunidad', 'Workshops'];

    // Convierte una fecha ISO a una etiqueta legible si el evento no
    // trae "dateLabel" propio (por robustez, no debería pasar nunca).
    function formatFallbackLabel(dateStr) {
      try {
        return new Date(dateStr + "T00:00:00").toLocaleDateString('es-AR', {
          weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
        }).toUpperCase();
      } catch (e) {
        return dateStr || "Fecha a confirmar";
      }
    }

    // Fecha corta legible (sin día de la semana), para el rango de una
    // temporada/exposición — ej. "3 de mayo de 2027".
    function formatDateOnly(dateStr) {
      try {
        return new Date(dateStr + "T00:00:00").toLocaleDateString('es-AR', {
          day: 'numeric', month: 'long', year: 'numeric'
        });
      } catch (e) {
        return dateStr;
      }
    }

    // NUEVO: para eventos "temporada" (exposiciones/muestras largas),
    // mostramos el rango en vez de una fecha suelta — así no hace falta
    // repetir el mismo evento cada día con una fecha distinta.
    function formatSeasonLabel(evt) {
      if (evt.endDate) {
        return `Hasta el ${formatDateOnly(evt.endDate)}`;
      }
      return `Desde el ${formatDateOnly(evt.date)}`;
    }

    // Anuncio en medio de la lista de eventos. Tamaño fijo (320x50), igual
    // patrón que los banners de arriba y abajo de la agenda, para evitar
    // el problema de tamaños gigantes en mobile que ya resolvimos ahí.
    function MidContentAd() {
      const pushed = React.useRef(false);
      React.useEffect(() => {
        if (pushed.current) return;
        pushed.current = true;
        try {
          (window.adsbygoogle = window.adsbygoogle || []).push({});
        } catch (e) {
          console.warn('AdSense push error:', e);
        }
      }, []);
      return (
        <div className="flex flex-col items-center py-2">
          <p className="text-[10px] uppercase tracking-widest text-slate-600 mb-1.5">Publicidad</p>
          <ins
            className="adsbygoogle"
            style={{ display: 'inline-block', width: '320px', height: '50px' }}
            data-ad-client="ca-pub-8667684098323123"
            data-ad-slot="5122509288"
          ></ins>
        </div>
      );
    }

    function App() {
      const [events, setEvents] = React.useState([]);
      const [isLoading, setIsLoading] = React.useState(true);
      const [loadError, setLoadError] = React.useState(false);
      const [lastUpdated, setLastUpdated] = React.useState(null);
      const [filterCategory, setFilterCategory] = React.useState('Todos');
      const [searchQuery, setSearchQuery] = React.useState('');

      React.useEffect(() => {
        fetch('./eventos.json', { cache: 'no-store' })
          .then((res) => {
            if (!res.ok) throw new Error("No se pudo cargar eventos.json");
            setLastUpdated(res.headers.get('last-modified'));
            return res.json();
          })
          .then((data) => {
            setEvents(Array.isArray(data) ? data : []);
          })
          .catch(() => {
            setLoadError(true);
          })
          .finally(() => setIsLoading(false));
      }, []);

      // Filtrado defensivo: un evento con fecha inválida o faltante NO
      // se muestra, en vez de colarse por defecto.
      const filteredEvents = events.filter((evt) => {
        if (!evt || typeof evt.date !== 'string') return false;
        const eventDate = new Date(evt.date + "T00:00:00");
        if (isNaN(eventDate.getTime())) return false;

        const endDateStr = evt.endDate && typeof evt.endDate === 'string' ? evt.endDate : evt.date;
        const eventEndDate = new Date(endDateStr + "T00:00:00");
        const referenceEnd = isNaN(eventEndDate.getTime()) ? eventDate : eventEndDate;

        // La agenda nunca muestra eventos ya finalizados.
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        if (referenceEnd < today) return false;

        const matchesCategory = filterCategory === 'Todos' ||
          (evt.category || '').toLowerCase().includes(filterCategory.toLowerCase());

        const q = searchQuery.trim().toLowerCase();
        const matchesSearch = q === '' ||
          (evt.title || '').toLowerCase().includes(q) ||
          (evt.venue || '').toLowerCase().includes(q) ||
          (evt.description || '').toLowerCase().includes(q);

        return matchesCategory && matchesSearch;
      });

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 font-sans antialiased">

          <header className="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50">
            <div className="max-w-5xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between gap-3">
              <div className="flex items-center gap-3 min-w-0">
                <div className="bg-amber-500 p-2 rounded-xl text-slate-950 shrink-0">
                  <Compass className="h-5 w-5" />
                </div>
                <div className="min-w-0">
                  <h1 className="font-extrabold text-base sm:text-lg tracking-tight text-white uppercase">
                    Venezuela en UK
                  </h1>
                  <p className="text-[11px] sm:text-xs text-slate-400 truncate">
                    Agenda cultural, social y deportiva
                  </p>
                </div>
              </div>
              {/* Apunta a mailto por ahora — si armás un formulario tipo Contact Form 7
                  en venenin.uk (mismo patrón que "Sugerir un Evento" en arenin.uk),
                  reemplazá esto por esa URL en vez del mailto. */}
              <a
                href="mailto:eventos@venenin.uk"
                target="_blank"
                rel="noopener noreferrer"
                className="shrink-0 flex items-center gap-1.5 px-3 py-2 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-amber-300 border border-slate-700 transition-colors"
              >
                <Mail className="h-3.5 w-3.5" />
                <span className="hidden sm:inline">Sugerir un evento</span>
                <span className="sm:hidden">Sugerir</span>
              </a>
            </div>
          </header>

          <main className="max-w-5xl mx-auto px-4 sm:px-6 py-6">

            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 mb-6 shadow-xl">
              <div className="grid grid-cols-1 md:grid-cols-12 gap-4 items-start">
                <div className="md:col-span-5 relative">
                  <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <Search className="h-4 w-4 text-slate-400" />
                  </div>
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="Buscar por artista, lugar..."
                    className="block w-full pl-9 pr-3 py-2.5 bg-slate-950 border border-slate-800 rounded-xl focus:ring-2 focus:ring-amber-500 focus:border-transparent text-slate-100 placeholder-slate-500 text-sm"
                  />
                </div>

                <div className="md:col-span-7">
                  <div className="flex items-center gap-1.5 mb-1.5">
                    <Filter className="h-3.5 w-3.5 text-slate-400" />
                    <span className="text-xs text-slate-400 font-medium">Categoría</span>
                  </div>
                  <div className="flex flex-wrap gap-1.5">
                    {categories.map((cat) => (
                      <button
                        key={cat}
                        onClick={() => setFilterCategory(cat)}
                        className={`px-2.5 py-1 rounded-lg text-xs font-semibold transition-all ${
                          filterCategory === cat
                            ? 'bg-amber-500 text-slate-950'
                            : 'bg-slate-950 hover:bg-slate-800 text-slate-400 border border-slate-800'
                        }`}
                      >
                        {cat}
                      </button>
                    ))}
                  </div>
                </div>
              </div>

              <div className="mt-4 pt-4 border-t border-slate-800/60 flex justify-between items-center text-xs text-slate-400">
                <span>
                  Mostrando <strong className="text-amber-400">{filteredEvents.length}</strong> eventos
                </span>
                {isLoading && (
                  <span className="flex items-center gap-1.5 text-amber-400">
                    <RefreshCw className="h-3.5 w-3.5 animate-spin" /> Cargando...
                  </span>
                )}
              </div>
            </div>

            {loadError && (
              <div className="text-center py-10 bg-amber-950/20 border border-amber-500/20 rounded-2xl mb-6">
                <p className="text-amber-400 text-sm font-medium">No se pudo cargar la agenda en este momento.</p>
                <p className="text-xs text-slate-500 mt-1">Probá recargar la página en unos minutos.</p>
              </div>
            )}

            <div className="space-y-4">
              {!isLoading && !loadError && filteredEvents.length === 0 ? (
                <div className="text-center py-16 bg-slate-900/40 rounded-2xl border border-dashed border-slate-800">
                  <Calendar className="h-10 w-10 text-slate-600 mx-auto mb-3" />
                  <p className="text-slate-400 font-medium">No se encontraron eventos con estos filtros.</p>
                </div>
              ) : (
                filteredEvents.map((evt, idx) => {
                  const venueText = (evt.venue || '').toLowerCase();
                  const cityText = (evt.city || '').toLowerCase();
                  const isVirtual = (evt.category || '').toLowerCase().includes('tv') ||
                    ['tv', 'bbc', 'itv', 'sky sports', 'player', 'streaming'].some((k) => venueText.includes(k)) ||
                    cityText.includes('nacional');

                  const mapsUrl = isVirtual ? null :
                    `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${evt.venue}, ${evt.city}, UK`)}`;

                  const isSeason = evt.type === 'temporada';

                  const card = (
                    <div key={`${evt.title}-${evt.date}-${idx}`} className="bg-slate-900 border border-slate-800/80 hover:border-amber-500/30 rounded-2xl p-5 sm:p-6 shadow-xl transition-all">
                      <div className="flex flex-col space-y-3">
                        <div className="flex items-center gap-2 text-xs flex-wrap">
                          <span className="bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2.5 py-0.5 rounded-md font-bold uppercase tracking-wider text-[10px]">
                            {evt.category || 'General'}
                          </span>
                          {isSeason && (
                            <span className="bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2.5 py-0.5 rounded-md font-bold uppercase tracking-wider text-[10px]">
                              Temporada
                            </span>
                          )}
                          <span className="text-slate-600">•</span>
                          <span className="text-slate-400 font-mono text-[11px]">{evt.source || 'Fuente desconocida'}</span>
                        </div>

                        <div>
                          <h3 className="text-lg font-extrabold text-white leading-snug">
                            {evt.link ? (
                              <a href={evt.link} target="_blank" rel="noopener noreferrer" className="inline-flex items-center hover:underline">
                                {evt.title}
                                <ExternalLink className="h-4 w-4 ml-2 shrink-0 text-amber-500/60" />
                              </a>
                            ) : evt.title}
                          </h3>
                          {evt.description && (
                            <p className="text-slate-400 text-sm leading-relaxed mt-1.5">{evt.description}</p>
                          )}
                        </div>

                        <div className="flex items-center gap-2.5 bg-slate-950/60 border border-slate-850 p-3 rounded-xl">
                          <Calendar className="h-4 w-4 text-amber-400 shrink-0" />
                          <span className="text-xs sm:text-sm font-bold uppercase tracking-wide text-amber-200 font-mono">
                            {isSeason ? formatSeasonLabel(evt) : (evt.dateLabel || formatFallbackLabel(evt.date))}
                          </span>
                        </div>

                        {evt.venue && (
                          <div className="flex items-start gap-2.5 text-slate-300 text-sm">
                            <MapPin className="h-4 w-4 text-rose-500 shrink-0 mt-0.5" />
                            <div>
                              {mapsUrl ? (
                                <a href={mapsUrl} target="_blank" rel="noopener noreferrer" className="hover:underline text-amber-400 font-bold inline-flex items-center gap-1.5">
                                  {evt.venue} <ExternalLink className="h-3 w-3" />
                                </a>
                              ) : (
                                <span className="font-bold text-slate-200">{evt.venue}</span>
                              )}
                              <span className="text-slate-500 block text-[11px]">
                                {evt.city}{evt.region ? ` • ${evt.region}` : ''} {isVirtual ? '(Transmisión)' : ''}
                              </span>
                            </div>
                          </div>
                        )}


                      </div>
                    </div>
                  );

                  // La posición del anuncio se calcula en función de cuántos
                  // eventos hay en la lista filtrada en este momento (varía
                  // día a día): a un cuarto de camino, con un mínimo de 12
                  // eventos totales para mostrarlo (si hay menos, no
                  // aparece, para no quedar pegado al final), y un máximo
                  // de posición 14 aunque la lista sea muy larga.
                  const totalEvents = filteredEvents.length;
                  const adPosition = Math.min(14, Math.floor(totalEvents / 4));
                  const showAd = totalEvents >= 12 && idx === adPosition;

                  if (showAd) {
                    return (
                      <React.Fragment key={`frag-${idx}`}>
                        {card}
                        <MidContentAd />
                      </React.Fragment>
                    );
                  }
                  return card;
                })
              )}
            </div>
          </main>

          <footer className="border-t border-slate-900 py-8 mt-12 text-slate-500 text-center text-xs">
            © {new Date().getFullYear()} Agenda Cultural Venezolana en UK. Proyecto libre y comunitario.
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
