name: Rastreador de Eventos Venezolanos

on:
  schedule:
    - cron: "0 5 * * *" # Todos los días a las 05:00 UTC (6am hora de Londres en horario de verano, BST — ajustar a 06:00 UTC cuando Londres vuelva a GMT en octubre)
  workflow_dispatch: {} # Permite dispararlo manualmente desde la pestaña Actions

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install project dependencies
        run: npm install @google/generative-ai

      - name: Esperar a que termine el rastreador de ARenIN (evita saturar Gemini)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 45); do
            activos=0
            for estado in in_progress queued; do
              n=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/arenin-apps/agenda-argentina/actions/workflows/cron-rastreador.yml/runs?status=$estado&per_page=1" | jq '.total_count // 0' || echo 0)
              activos=$((activos + ${n:-0}))
            done
            if [ "$activos" -eq 0 ]; then
              echo "El rastreador de ARenIN no esta corriendo, sigo."
              exit 0
            fi
            echo "El rastreador de ARenIN sigue corriendo; espero 60s ($i/45)..."
            sleep 60
          done
          echo "Pasaron 45 min; sigo igual."

      - name: Run Script Extractor with Gemini AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node script-extractor.js

      - name: Commit y push si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add eventos.json
          git diff --quiet --cached || git commit -m "🤖 Actualización automática de eventos de Venezuela en UK"
          git push
